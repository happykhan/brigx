<!doctype html>
<html lang="en" class="h-full" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRIGX - Browser-Based Ring Image Generator</title>
    <meta name="description" content="Circular comparative genome visualization tool running entirely in your browser" />
    <script>
      (function() {
        var theme = localStorage.getItem('gx-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
